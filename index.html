<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Web Page</title>
        <link rel="stylesheet" href="styles/main.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mdbassit/Coloris@latest/dist/coloris.min.css"/>
        <script src="https://cdn.jsdelivr.net/gh/mdbassit/Coloris@latest/dist/coloris.min.js" defer></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js" defer></script>
        <script type="module" src="./main.js" defer></script>
    </head>
    <body>
        <nav class="toolbar">
            <button class="toolbar__button toolbar__button--sidebar" aria-label="Toggle sidebar" data-icon="pagesview"></button>

            <section class="toolbar__popup">
                <nav class="toolbar__popup toolbar__popup--options">
                    <button class="toolbar__button toolbar__button--pages" aria-label="Pages" data-icon="pages"></button>
                    <button class="toolbar__button toolbar__button--chapters" aria-label="Chapters" data-icon="list"></button>
                    <button class="toolbar__button toolbar__button--annotations" aria-label="Annotations" data-icon="annotations"></button>
                </nav>
                <div class="toolbar__popup toolbar__popup--infoWrapper"></div>
            </section>

            <section class="toolbar__tools toolbar__tools--secondary">
                <button class="toolbar__button toolbar__button--open" id="pdf-open-btn" aria-label="Open PDF" data-icon="upload"></button>
                <input type="file" id="pdf-file-input" accept="application/pdf" style="display: none">
                <input type="text" class="toolbar__input toolbar__input--filename" placeholder="File name" aria-label="File name">
                <button class="toolbar__button toolbar__button--presentation" aria-label="Presentation mode" data-icon="presentation"></button>
                <button class="toolbar__button toolbar__button--grab"         aria-label="Grab mode"         data-icon="grab"></button>
                <button class="toolbar__button toolbar__button--tts"          aria-label="Text to speech"    data-icon="speaker"></button>
                <div class="toolbar__popup"></div>
                <button class="toolbar__button toolbar__button--themeswitch" aria-label="Toggle theme">
                    <span data-icon="moon"></span>
                    <span data-icon="sun" style="display:none"></span>
                </button>
            </section>

            <section class="toolbar__tools toolbar__tools--navegation">
                <button class="toolbar__button toolbar__button--prev"        aria-label="Previous page" data-icon="previous"></button>
                <button class="toolbar__button toolbar__button--next"        aria-label="Next page"     data-icon="next"></button>
                <input type="number" class="toolbar__input toolbar__input--page" aria-label="Current page">
                <span class="toolbar__input toolbar__input--total">
                    <label class="toolbar__input__label">/</label>
                </span>

                <div class="toolbar__button-wrapper">
                    <button class="toolbar__button toolbar__button--search" aria-label="Search" data-icon="search"></button>
                    <div class="toolbar__popup toolbar__popup--search">
                        <input type="text" class="toolbar__popup__search-input" aria-label="Search text">
                        <button class="toolbar__popup__search-button toolbar__popup__search-button--prev"      aria-label="Previous match" data-icon="previous"></button>
                        <button class="toolbar__popup__search-button toolbar__popup__search-button--next"      aria-label="Next match"     data-icon="next"></button>
                        <button class="toolbar__popup__search-button toolbar__popup__search-button--highlight" aria-label="Highlight matches">Highlight</button>
                        <button class="toolbar__popup__search-button toolbar__popup__search-button--underline" aria-label="Underline matches">Underline</button>
                    </div>
                </div>

                <button class="toolbar__button toolbar__button--zoom-in"     aria-label="Zoom in"       data-icon="plus"></button>
                <button class="toolbar__button toolbar__button--zoom-out"    aria-label="Zoom out"      data-icon="minus"></button>
                <button class="toolbar__button toolbar__button--scroll-mode" aria-label="Vertical view" data-icon="vertical-view"></button>
                <button class="toolbar__button toolbar__button--rotateleft"  aria-label="Rotate left"   data-icon="rotate-left"></button>
                <button class="toolbar__button toolbar__button--flip"        aria-label="Flip 180°"     data-icon="rotate"></button>
                <button class="toolbar__button toolbar__button--rotateright" aria-label="Rotate right"  data-icon="rotate-right"></button>
            </section>

            <section class="toolbar__tools toolbar__tools--primary">

                <div class="toolbar__button-wrapper">
                    <button class="toolbar__button toolbar__button--highlight" aria-label="Highlight text" data-icon="highlighter"></button>
                    <div class="toolbar__popup toolbar__popup--highlight">
                        <div class="toolbar__popup__customcolor">
                            <label class="toolbar__popup__customcolor-label">Custom Color:</label>
                            <input type="text" class="toolbar__popup__customcolor-input" readonly placeholder="#000000" aria-label="Custom highlight color">
                        </div>
                        <div class="toolbar__popup-colors">
                            <button class="toolbar__popup__color toolbar__popup__color--default" aria-label="Yellow">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFEE8C"/></svg>
                            </button>
                            <button class="toolbar__popup__color toolbar__popup__color--default" aria-label="Green">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#AFE354"/></svg>
                            </button>
                            <button class="toolbar__popup__color toolbar__popup__color--default" aria-label="Blue">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#80CEE1"/></svg>
                            </button>
                            <button class="toolbar__popup__color toolbar__popup__color--default" aria-label="Pink">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="pink"/></svg>
                            </button>
                            <button class="toolbar__popup__color toolbar__popup__color--default" aria-label="Red">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FF746C"/></svg>
                            </button>
                        </div>
                        <div class="toolbar__popup-thickness">
                            <label class="toolbar__popup__thickness-label">Thickness:</label>
                            <input type="range" class="toolbar__popup__thickness-input" max="50" aria-label="Highlight thickness">
                        </div>
                    </div>
                </div>

                <div class="toolbar__button-wrapper">
                    <button class="toolbar__button toolbar__button--underline" aria-label="Underline text" data-icon="underline"></button>
                    <div class="toolbar__popup toolbar__popup--underline">
                        <div class="toolbar__popup__customcolor">
                            <label class="toolbar__popup__customcolor-label">Custom Color:</label>
                            <input type="text" class="toolbar__popup__customcolor-input" readonly placeholder="#000000" aria-label="Custom underline color">
                        </div>
                        <div class="toolbar__popup-colors">
                            <button class="toolbar__popup__color toolbar__popup__color--default" aria-label="Yellow">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFEE8C"/></svg>
                            </button>
                            <button class="toolbar__popup__color toolbar__popup__color--default" aria-label="Green">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#AFE354"/></svg>
                            </button>
                            <button class="toolbar__popup__color toolbar__popup__color--default" aria-label="Blue">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#80CEE1"/></svg>
                            </button>
                            <button class="toolbar__popup__color toolbar__popup__color--default" aria-label="Pink">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="pink"/></svg>
                            </button>
                            <button class="toolbar__popup__color toolbar__popup__color--default" aria-label="Red">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FF746C"/></svg>
                            </button>
                        </div>
                        <div class="toolbar__popup-thickness">
                            <label class="toolbar__popup__thickness-label">Thickness:</label>
                            <input type="range" class="toolbar__popup__thickness-input" max="50" aria-label="Underline thickness">
                        </div>
                    </div>
                </div>

                <div class="toolbar__button-wrapper">
                    <button class="toolbar__button toolbar__button--addimage" aria-label="Add image" data-icon="addpicture"></button>
                    <div class="toolbar__popup toolbar__popup--addimage">
                        <label class="toolbar__popup__addimage-label">Add Image</label>
                        <button class="toolbar__popup__addimage-btn" aria-label="Upload image" data-icon="upload"></button>
                        <input type="file" class="toolbar__popup__addimage-input" accept="image/*" style="display:none" aria-label="Select image file">
                    </div>
                </div>

                <div class="toolbar__button-wrapper">
                    <button class="toolbar__button toolbar__button--signature" aria-label="Add signature" data-icon="sign"></button>
                    <div class="toolbar__popup"></div>
                </div>

            </section>
        </nav>

        <main class="pdfviewer">
            <div id="viewer" class="pdfviewer__container">
                <canvas id="pdf-canvas"></canvas>
                <div id="text-layer" class="textLayer"></div>
            </div>
        </main>
    </body>
</html>
